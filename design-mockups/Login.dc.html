<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;color:#14213D;background:#F3F5F9;-webkit-font-smoothing:antialiased}
    a{color:#2C64C6;text-decoration:none} a:hover{color:#1F4FA3}
    .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .fld{display:flex;flex-direction:column;gap:6px}
    .lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5B6472}
    .inp{height:42px;border:1px solid #D5DCE6;border-radius:8px;padding:0 12px;font-size:13.5px;color:#14213D;background:#fff;display:flex;align-items:center;gap:10px}
  </style>
</helmet>
<div style="width:1440px;min-height:900px;background:linear-gradient(180deg,#14213D 0px,#1E3A6A 200px,#9FB3D3 360px,#E4EAF2 520px,#F3F5F9 640px);display:flex;flex-direction:column;align-items:center;padding-top:96px">
  <div style="display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:36px">
    <svg class="ic" viewBox="0 0 24 24" style="width:34px;height:34px;color:#fff"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>
    <div>
      <div style="font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1">VeriScale</div>
      <div style="margin-top:3px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)">NAWI Report Studio · OIML R-76</div>
    </div>
  </div>

  <div style="width:420px;background:#fff;border:1px solid #E3E8EF;border-radius:14px;box-shadow:0 1px 2px rgba(20,33,61,.06),0 18px 48px rgba(20,33,61,.16);padding:32px">
    <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em">Sign in</h1>
    <p style="margin:4px 0 24px;font-size:13px;color:#5B6472">Lab Technician / Reviewer access</p>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="fld">
        <span class="lbl">Email</span>
        <div class="inp"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;color:#8A93A3"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>arjun.mehta@veriscale-lab.example</div>
      </div>
      <div class="fld">
        <span class="lbl">Password</span>
        <div class="inp"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;color:#8A93A3"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span style="letter-spacing:.2em">••••••••••</span></div>
      </div>
      <div style="height:44px;border-radius:8px;background:#2C64C6;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:4px">Sign in</div>
    </div>
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid #EDF0F4;font-size:12px;color:#5B6472;text-align:center;line-height:1.5">Accounts are provisioned by an administrator.<br>Contact your lab admin if you need access.</div>
  </div>
</div>
</x-dc>
</body>
</html>
